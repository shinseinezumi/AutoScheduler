services:
  app:
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    networks:
      - ai-network
    command:
      [
        "node", "--watch", "app.js"
      ]
    

  api:
    volumes:
      - ./api:/app
    networks:
      - ai-network
    command:
      [
        "uvicorn",
        "server:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload"
      ]


networks:
  ai-network:
    external: true
    name: ai-network

volumes:
  node_modules: